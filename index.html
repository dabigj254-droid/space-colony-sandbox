<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Colony Fleet Command</title>
  <style>
    body {
      background-color: #0b0c10;
      color: #c5c6c7;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      user-select: none;
    }

    #game-container {
      background-color: #1f2833;
      border: 2px solid #66fcf1;
      border-radius: 10px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 0 20px rgba(102, 252, 241, 0.2);
      width: 400px;
    }

    h1 { color: #66fcf1; margin-bottom: 5px; font-size: 24px; }
    .stat-box { font-size: 18px; margin: 15px 0; color: #45f3ff; }
    
    button {
      background-color: transparent;
      border: 2px solid #66fcf1;
      color: #66fcf1;
      padding: 12px 24px;
      font-size: 16px;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      cursor: pointer;
      margin: 10px 0;
      transition: all 0.2s ease;
      width: 100%;
      border-radius: 5px;
    }

    button:hover {
      background-color: #66fcf1;
      color: #0b0c10;
      box-shadow: 0 0 15px rgba(102, 252, 241, 0.5);
    }

    .shop-box {
      margin-top: 25px;
      border-top: 1px solid #45f3ff;
      padding-top: 15px;
    }

    /* Dynamic UI Animation Module */
    .error-popup {
      position: absolute;
      color: #ff4757;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 16px;
      pointer-events: none;
      z-index: 9999;
      animation: fadeUp 1.2s ease-out forwards;
    }

    @keyframes fadeUp {
      0% { opacity: 1; transform: translateY(0px) scale(1); }
      100% { opacity: 0; transform: translateY(-50px) scale(0.85); }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <h1>FLEET COMMAND OS</h1>
    <div id="prestige-display" style="color: #ffa500; font-size: 14px; font-weight: bold;">Rank: Cosmic Cadet (Prestige 0)</div>
    
    <div class="stat-box">
      🚀 Space Dust: <span id="dust-count">0</span><br>
      ⚡ Multiplier: <span id="multi-display">1x</span>
    </div>

    <button id="click-btn">EXTRACT SPACE DUST</button>

    <div class="shop-box">
      <h3 style="color: #45f3ff; margin: 5px 0;">UPGRADE BAY</h3>
      <button id="buy-drone">BUY EXTRACTOR DRONE (Cost: 15 Dust)</button>
      <button id="prestige-btn" style="border-color: #ffa500; color: #ffa500; margin-top: 15px;">INITIATE QUANTUM RESET</button>
    </div>
  </div>

  <script>
    // --- FOUNDATIONAL STATE SYSTEM ---
    let spaceDust = 0;
    let extractionPower = 1;
    let droneCost = 15;
    
    // Prestige Multiplier Variables
    let prestigeLevel = 0;
    let globalMultiplier = 1;

    // --- DOM LINK CHANNELS ---
    const dustDisplay = document.getElementById("dust-count");
    const multiDisplay = document.getElementById("multi-display");
    const prestigeDisplay = document.getElementById("prestige-display");
    const droneBtn = document.getElementById("buy-drone");
    const clickBtn = document.getElementById("click-btn");
    const prestigeBtn = document.getElementById("prestige-btn");

    // --- CORE LOGIC MOTORS ---

    // 1. Extraction Command Loop
    clickBtn.addEventListener("click", () => {
      spaceDust += extractionPower * globalMultiplier;
      updateUserInterface();
    });

    // 2. Upgrade Verification Loop
    droneBtn.addEventListener("click", (event) => {
      if (spaceDust >= droneCost) {
        spaceDust -= droneCost;
        extractionPower += 1;
        droneCost = Math.round(droneCost * 1.5); // Exponential price scaling multiplier
        updateUserInterface();
      } else {
        // Triggering the custom floating alert instead of a boring browser popup
        triggerErrorAlert("ERROR: INSUFFICIENT SPACE DUST!", event);
      }
    });

    // 3. Quantum Prestige Reset Engine
    prestigeBtn.addEventListener("click", (event) => {
      // User must hit at least 500 space dust to justify a hardware prestige wipe
      if (spaceDust >= 500) {
        prestigeLevel++;
        globalMultiplier = Math.pow(2.75, prestigeLevel); // Compounding x2.75 scaling math
        
        // Resetting the baseline game loops
        spaceDust = 0;
        extractionPower = 1;
        droneCost = 15;
        
        updateUserInterface();
        triggerErrorAlert(`PRESTIGE SYNC COMPLETE! MULTIPLIER LEVEL UP!`, event);
      } else {
        triggerErrorAlert("REQUIRES 500 SPACE DUST TO CONVERT CALIBRATION!", event);
      }
    });

    // 4. Dynamic UI Rendering Module
    function updateUserInterface() {
      dustDisplay.innerText = Math.round(spaceDust);
      multiDisplay.innerText = `${globalMultiplier.toFixed(2)}x`;
      prestigeDisplay.innerText = `Rank: Fleet Admiral (Prestige ${prestigeLevel})`;
      droneBtn.innerText = `BUY EXTRACTOR DRONE (Cost: ${droneCost} Dust)`;
    }

    // 5. The Floating Error Script (Hardware Interface System)
    function triggerErrorAlert(message, event) {
      const errorText = document.createElement("div");
      errorText.className = "error-popup";
      errorText.innerText = message;

      // Map the coordinate telemetry parameters to the exact pixel location of the mouse cursor
      errorText.style.left = event.clientX + "px";
      errorText.style.top = event.clientY + "px";

      // If the event layout was triggered via a script call instead of a true click, anchor it centrally
      if (!event.clientX) {
        errorText.style.left = "50%";
        errorText.style.top = "40%";
      }

      document.body.appendChild(errorText);

      // Automated Memory Garbage Collection
      setTimeout(() => {
        errorText.remove();
      }, 1200);
    }
  </script>
</body>
</html>
